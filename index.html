<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="StockMix" />
  <link rel="manifest" href="manifest.json" />
  <title>StockMix</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:         #0a0a0f;
      --bg2:        #111118;
      --bg3:        #1a1a24;
      --border:     rgba(255,255,255,0.07);
      --border2:    rgba(255,255,255,0.13);
      --text:       #e8e8f0;
      --muted:      #6b6b80;
      --muted2:     #44445a;
      --up:         #00e5a0;
      --up-dim:     rgba(0,229,160,0.12);
      --up-glow:    rgba(0,229,160,0.35);
      --down:       #ff4d6d;
      --down-dim:   rgba(255,77,109,0.12);
      --down-glow:  rgba(255,77,109,0.35);
      --flat:       #7b7b96;
      --accent:     #7c6af5;
      --accent-dim: rgba(124,106,245,0.15);
      --font-mono:  'DM Mono', monospace;
      --font-display: 'Syne', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100dvh;
      overscroll-behavior: none;
    }

    /* ─── Grain overlay ─── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    #app {
      position: relative; z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 0 100px;
      min-height: 100dvh;
    }

    /* ─── Header ─── */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px 14px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse-logo 2s infinite;
    }
    @keyframes pulse-logo {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .header-meta {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ─── Search Bar ─── */
    .search-wrap {
      position: relative;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.03em;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .search-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      color: #fff;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s, transform 0.1s;
    }
    .search-btn:active { opacity: 0.8; transform: scale(0.97); }

    /* ─── Section label ─── */
    .section-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 24px 20px 10px;
    }

    /* ─── Portfolio Card ─── */
    .card {
      margin: 0 16px 14px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: border-color 0.3s;
    }
    .card.up   { border-color: rgba(0,229,160,0.2); }
    .card.down { border-color: rgba(255,77,109,0.2); }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border);
    }

    .card-name {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
      line-height: 1.2;
    }
    .card-desc {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: 0.02em;
    }

    .card-delete {
      background: none;
      border: none;
      color: var(--muted2);
      font-size: 18px;
      cursor: pointer;
      padding: 2px 6px;
      line-height: 1;
      transition: color 0.15s;
    }
    .card-delete:hover { color: var(--down); }

    /* ─── Big number ─── */
    .card-body {
      padding: 18px 18px 14px;
    }

    .card-rate-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 12px;
    }

    .card-rate {
      font-family: var(--font-display);
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      transition: color 0.4s;
    }
    .card-rate.up   { color: var(--up);   text-shadow: 0 0 30px var(--up-glow); }
    .card-rate.down { color: var(--down); text-shadow: 0 0 30px var(--down-glow); }
    .card-rate.flat { color: var(--flat); }

    .card-rate-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.05em;
    }
    .card-rate-badge.up   { background: var(--up-dim);   color: var(--up); }
    .card-rate-badge.down { background: var(--down-dim); color: var(--down); }
    .card-rate-badge.flat { background: rgba(123,123,150,0.15); color: var(--flat); }

    /* ─── Flash animation on update ─── */
    @keyframes flash-up {
      0%   { background: var(--up-dim); }
      100% { background: transparent; }
    }
    @keyframes flash-down {
      0%   { background: var(--down-dim); }
      100% { background: transparent; }
    }
    .flash-up   { animation: flash-up   0.6s ease-out; }
    .flash-down { animation: flash-down 0.6s ease-out; }

    /* ─── Holdings bar ─── */
    .card-holdings {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .holding-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .holding-name {
      font-size: 11px;
      color: var(--muted);
      width: 64px;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .holding-bar-wrap {
      flex: 1;
      height: 4px;
      background: var(--bg3);
      border-radius: 2px;
      overflow: hidden;
    }
    .holding-bar {
      height: 100%;
      border-radius: 2px;
      background: var(--accent);
      transition: width 0.8s ease;
    }

    .holding-pct {
      font-size: 11px;
      width: 48px;
      text-align: right;
      flex-shrink: 0;
      transition: color 0.4s;
    }
    .holding-pct.up   { color: var(--up); }
    .holding-pct.down { color: var(--down); }
    .holding-pct.flat { color: var(--flat); }

    /* ─── Card footer ─── */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      border-top: 1px solid var(--border);
    }

    .card-update-time {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .card-status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--up);
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .card-status-dot.error { background: var(--down); animation: none; }
    .card-status-dot.loading { background: var(--flat); animation: none; }

    /* ─── Status indicator ─── */
    .global-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    .status-live { color: var(--up); }

    /* ─── Add portfolio form ─── */
    .add-portfolio-panel {
      margin: 0 16px 14px;
      background: var(--bg2);
      border: 1px dashed var(--border2);
      border-radius: 16px;
      padding: 18px;
      display: none;
    }
    .add-portfolio-panel.visible { display: block; }

    .panel-title {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--text);
    }
    .panel-field {
      margin-bottom: 10px;
    }
    .panel-label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .panel-input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .panel-input:focus { border-color: var(--accent); }

    .panel-hint {
      font-size: 10px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .panel-actions {
      display: flex;
      gap: 8px;
    }
    .btn-primary {
      flex: 1;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      padding: 10px;
      color: #fff;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-primary:active { opacity: 0.8; }
    .btn-cancel {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
    }

    /* ─── Empty state ─── */
    .empty {
      text-align: center;
      padding: 60px 40px;
      color: var(--muted);
    }
    .empty-icon { font-size: 40px; margin-bottom: 14px; opacity: 0.4; }
    .empty-text { font-size: 13px; line-height: 1.6; }

    /* ─── Toast ─── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
      z-index: 999;
      transition: transform 0.3s ease;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* ─── Auth UI ─── */
    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: opacity 0.15s, border-color 0.2s;
      white-space: nowrap;
      font-family: var(--font-mono);
    }
    .auth-badge:active { opacity: 0.75; }
    .auth-badge.logged-in {
      background: var(--up-dim);
      border-color: rgba(0,229,160,0.2);
      color: var(--up);
    }
    .auth-badge.logged-out {
      background: var(--accent-dim);
      border-color: rgba(124,106,245,0.25);
      color: var(--accent);
    }
    .auth-badge .auth-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .auth-badge.logged-in  .auth-dot { background: var(--up); }
    .auth-badge.logged-out .auth-dot { background: var(--accent); }

    /* merge progress banner */
    .merge-banner {
      margin: 0 16px 14px;
      padding: 12px 16px;
      background: var(--accent-dim);
      border: 1px solid rgba(124,106,245,0.25);
      border-radius: 12px;
      font-size: 12px;
      color: var(--accent);
      display: none;
      align-items: center;
      gap: 10px;
    }
    .merge-banner.visible { display: flex; }
    .merge-spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(124,106,245,0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      flex-shrink: 0;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="app">

  <!-- ─── Header ─── -->
  <div class="header">
    <div class="header-top">
      <div class="logo">
        <span class="logo-dot"></span>
        StockMix
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="global-status" id="globalStatus">
          <span class="status-live">●</span>
          <span id="statusText">实时</span>
        </div>
        <!-- 登录状态徽章：点击可登录/退出 -->
        <div class="auth-badge logged-out" id="authBadge" onclick="handleAuthClick()">
          <span class="auth-dot"></span>
          <span id="authLabel">登录</span>
        </div>
      </div>
    </div>
    <div class="search-wrap">
      <input
        class="search-input"
        id="searchInput"
        type="text"
        placeholder="输入组合代码，回车或点击添加…"
        autocomplete="off"
        spellcheck="false"
        onkeydown="if(event.key==='Enter') fetchAndAdd()"
      />
      <button class="search-btn" onclick="fetchAndAdd()">＋ 添加</button>
    </div>
  </div>

  <!-- ─── Loading hint panel（后端拉取中） ─── -->
  <div class="add-portfolio-panel" id="addPanel">
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="logo-dot" style="flex-shrink:0;animation:pulse-logo 1s infinite;"></div>
      <div style="font-size:13px;color:var(--muted);" id="addPanelMsg">正在从后端加载组合配方…</div>
    </div>
  </div>

  <!-- ─── 云端合并进度条 ─── -->
  <div class="merge-banner" id="mergeBanner">
    <div class="merge-spinner"></div>
    <span id="mergeBannerMsg">正在将本地组合同步到云端…</span>
  </div>

  <!-- ─── Portfolio list ─── -->
  <div class="section-label">持仓组合</div>
  <div id="portfolioList"></div>

</div>

<div class="toast" id="toast"></div>

<script>
// ╔══════════════════════════════════════════════╗
// ║           StockMix  —  核心逻辑              ║
// ╚══════════════════════════════════════════════╝

// ─── Mock 示例组合（开箱即用） ───────────────────
const MOCK_PORTFOLIOS = [
  {
    id: 'demo-1',
    name: '白酒科技混合',
    holdings: [
      { stockCode: 'sh600519', stockName: '贵州茅台', weight: 0.0985 },
      { stockCode: 'hk00700',  stockName: '腾讯控股', weight: 0.0941 },
      { stockCode: 'sz000858', stockName: '五粮液',   weight: 0.0820 },
    ]
  },
  {
    id: 'demo-2',
    name: '新能源核心',
    holdings: [
      { stockCode: 'sz300750', stockName: '宁德时代', weight: 0.15 },
      { stockCode: 'sh601899', stockName: '紫金矿业', weight: 0.10 },
      { stockCode: 'sz002594', stockName: '比亚迪',   weight: 0.12 },
    ]
  }
];

// ╔══════════════════════════════════════════════════════╗
// ║            Auth 模块 — Token 管理与鉴权               ║
// ╚══════════════════════════════════════════════════════╝

const AUTH = {
  TOKEN_KEY: 'sm_token',
  USER_KEY:  'sm_user',

  /** 读取 token（null = 未登录） */
  getToken() {
    return localStorage.getItem(this.TOKEN_KEY) || null;
  },

  /** 保存登录信息 */
  setSession(token, username) {
    localStorage.setItem(this.TOKEN_KEY, token);
    if (username) localStorage.setItem(this.USER_KEY, username);
  },

  /** 清除登录信息 */
  clearSession() {
    localStorage.removeItem(this.TOKEN_KEY);
    localStorage.removeItem(this.USER_KEY);
  },

  /** 是否已登录 */
  isLoggedIn() {
    return !!this.getToken();
  },

  /** 返回带鉴权的公共请求头 */
  authHeaders() {
    return {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${this.getToken()}`,
    };
  },

  /** 获取显示用用户名 */
  getUsername() {
    return localStorage.getItem(this.USER_KEY) || '已登录';
  },
};

// ─── 更新 Header 中的登录状态徽章 ──────────────────────
function refreshAuthBadge() {
  const badge = document.getElementById('authBadge');
  const label = document.getElementById('authLabel');
  if (AUTH.isLoggedIn()) {
    badge.className = 'auth-badge logged-in';
    label.textContent = AUTH.getUsername() + ' · 退出';
  } else {
    badge.className = 'auth-badge logged-out';
    label.textContent = '登录';
  }
}

// ─── 点击登录/退出 ──────────────────────────────────────
function handleAuthClick() {
  if (AUTH.isLoggedIn()) {
    // 退出：清除 token，切回本地模式
    AUTH.clearSession();
    refreshAuthBadge();
    showToast('已退出登录，切换到本地模式');
  } else {
    // 此处接入你的登录流程。
    // 示例：弹出 prompt 输入 token（生产环境替换为跳转登录页或弹窗）
    const token = prompt('请输入 Token（由后端登录接口颁发）：');
    if (!token || !token.trim()) return;
    const username = prompt('请输入用户名（选填，仅用于显示）：') || '用户';
    AUTH.setSession(token.trim(), username.trim());
    refreshAuthBadge();
    showToast(`欢迎，${username}！正在同步本地数据…`);
    // 登录后立即触发一次本地→云端合并
    mergeLocalToServer();
  }
}

// ╔══════════════════════════════════════════════════════╗
// ║          云端合并：本地组合 → POST /merge             ║
// ╚══════════════════════════════════════════════════════╝

// 接口约定：POST /api/v1/user/portfolio/merge
// 请求体：{ "codes": ["code-a", "code-b", ...] }
// 成功后端将这些代码与当前账号绑定；前端随后清空本地缓存，
// 再从后端重新拉取该账号下的全量组合列表。
async function mergeLocalToServer() {
  if (!AUTH.isLoggedIn()) return;

  // 收集本地所有组合的 code 字段（排除纯 Mock 演示数据）
  const localCodes = portfolios
    .filter(p => p.code)          // Mock 数据没有 .code 字段，跳过
    .map(p => p.code);

  const banner    = document.getElementById('mergeBanner');
  const bannerMsg = document.getElementById('mergeBannerMsg');

  if (!localCodes.length) {
    // 没有需要合并的本地数据，直接拉取云端列表
    await fetchServerPortfolios();
    return;
  }

  // 显示进度条
  bannerMsg.textContent = `正在将 ${localCodes.length} 个本地组合同步到云端…`;
  banner.classList.add('visible');

  try {
    const res = await fetch(`${API_BASE_USER}/portfolio/merge`, {
      method:  'POST',
      headers: AUTH.authHeaders(),
      body:    JSON.stringify({ codes: localCodes }),
    });

    if (res.status === 401) { handleTokenExpired(); return; }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    // 合并成功：清空本地缓存，切换为纯云端模式
    localStorage.removeItem('sm_portfolios');
    portfolios = [];
    showToast(`已同步 ${localCodes.length} 个组合到云端 ✓`);

    // 拉取云端最新列表
    await fetchServerPortfolios();

  } catch (err) {
    console.error('[StockMix] 云端合并失败:', err);
    showToast(`同步失败：${err.message}，继续使用本地数据`);
  } finally {
    banner.classList.remove('visible');
  }
}

// ─── 从后端拉取该账号下的全量组合列表 ───────────────────
// 接口约定：GET /api/v1/user/portfolio/list
// 返回：{ data: [ { id, code, portfolioName, holdings:[...] }, ... ] }
async function fetchServerPortfolios() {
  if (!AUTH.isLoggedIn()) return;

  try {
    const res = await fetch(`${API_BASE_USER}/portfolio/list`, {
      method:  'GET',
      headers: AUTH.authHeaders(),
    });

    if (res.status === 401) { handleTokenExpired(); return; }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const body = await res.json();
    const list = body.data || body; // 兼容直接返回数组

    if (Array.isArray(list)) {
      // 将云端数据规范化为前端通用格式
      portfolios = list.map(item => ({
        id:       item.id || ('srv_' + Date.now() + Math.random()),
        code:     item.code || '',
        name:     item.portfolioName || item.name || item.code,
        holdings: item.holdings || [],
      }));
      renderList();
      pollAll();
    }
  } catch (err) {
    console.error('[StockMix] 拉取云端组合失败:', err);
    showToast(`云端列表加载失败：${err.message}`);
  }
}

// ─── Token 过期统一处理 ────────────────────────────────
function handleTokenExpired() {
  AUTH.clearSession();
  refreshAuthBadge();
  showToast('登录已过期，请重新登录');
  console.warn('[StockMix] Token 已失效，已自动退出');
}

// ─── 状态 ────────────────────────────────────────
let portfolios = JSON.parse(localStorage.getItem('sm_portfolios') || 'null') || MOCK_PORTFOLIOS;
let priceCache = {};   // code → { percent, name }
let pollTimer  = null;

// ─── 代码格式转换 ──────────────────────────────
// sh600519 → 0600519 | sz000858 → 1000858 | hk00700 → hk00700
function toWyCode(code) {
  if (code.startsWith('sh')) return '0' + code.slice(2);
  if (code.startsWith('sz')) return '1' + code.slice(2);
  return code; // hk 直接返回
}

// ─── 拉取行情（JSONP） ─────────────────────────
function fetchQuotes(codes) {
  return new Promise((resolve) => {
    const wywCodes = codes.map(toWyCode).join(',');
    const cbName   = '_sm_cb_' + Date.now();
    const script   = document.createElement('script');
    const timer    = setTimeout(() => {
      cleanup();
      resolve({});
    }, 8000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = function(data) {
      cleanup();
      // data 结构: { "0600519": { percent, name, ... }, ... }
      const result = {};
      // 网易接口直接返回对象，key 是转换后的代码
      Object.entries(data || {}).forEach(([k, v]) => {
        if (v && typeof v.percent !== 'undefined') {
          result[k] = { percent: parseFloat(v.percent), name: v.name || k };
        }
      });
      resolve(result);
    };

    // 网易财经 JSONP 接口，callback 参数名为 callback
    script.src = `https://api.money.126.net/data/feed/${wywCodes},money.api?callback=${cbName}`;
    script.onerror = () => { cleanup(); resolve({}); };
    document.head.appendChild(script);
  });
}

// ─── 归一化加权计算 ────────────────────────────
function calcPortfolioRate(holdings) {
  let weightedSum = 0;
  let totalWeight = 0;
  let filled      = 0;

  holdings.forEach(h => {
    const wyCode = toWyCode(h.stockCode);
    const cached = priceCache[wyCode];
    if (cached && typeof cached.percent === 'number') {
      weightedSum += cached.percent * h.weight;
      totalWeight += h.weight;
      filled++;
    }
  });

  if (totalWeight === 0) return null;
  return {
    rate:   weightedSum / totalWeight,
    filled: filled,
    total:  holdings.length
  };
}

// ─── 轮询主流程 ────────────────────────────────
async function pollAll() {
  const allCodes = [];
  portfolios.forEach(p => p.holdings.forEach(h => allCodes.push(h.stockCode)));
  const unique = [...new Set(allCodes)];
  if (!unique.length) return;

  setStatus('loading');
  const data = await fetchQuotes(unique);

  // 合并缓存
  Object.assign(priceCache, data);

  if (Object.keys(data).length > 0) {
    setStatus('live');
  } else {
    setStatus('error');
  }

  portfolios.forEach(p => renderCard(p));
}

// ─── 渲染卡片 ──────────────────────────────────
function renderCard(portfolio) {
  const el  = document.getElementById('card-' + portfolio.id);
  if (!el) return;

  const calc = calcPortfolioRate(portfolio.holdings);
  const now  = new Date().toLocaleTimeString('zh-CN', { hour12: false });

  // Big number
  const rateEl  = el.querySelector('.card-rate');
  const badgeEl = el.querySelector('.card-rate-badge');
  const bodyEl  = el.querySelector('.card-body');

  if (!calc) {
    rateEl.textContent   = '加载中…';
    rateEl.className     = 'card-rate flat';
    badgeEl.textContent  = '---';
    badgeEl.className    = 'card-rate-badge flat';
    el.className         = 'card';
  } else {
    const r     = calc.rate;
    const sign  = r > 0 ? '+' : '';
    const cls   = r > 0.001 ? 'up' : r < -0.001 ? 'down' : 'flat';
    const prev  = parseFloat(rateEl.dataset.prev || '0');

    rateEl.textContent   = sign + r.toFixed(2) + '%';
    rateEl.className     = 'card-rate ' + cls;
    rateEl.dataset.prev  = r;

    badgeEl.textContent  = calc.filled + '/' + calc.total + ' 支';
    badgeEl.className    = 'card-rate-badge ' + cls;

    el.classList.remove('up', 'down');
    el.classList.add(cls === 'flat' ? '' : cls);

    // Flash effect
    if (Math.abs(r - prev) > 0.001) {
      bodyEl.classList.remove('flash-up', 'flash-down');
      void bodyEl.offsetWidth; // reflow
      bodyEl.classList.add(r > prev ? 'flash-up' : 'flash-down');
    }
  }

  // Holdings rows
  const maxW = Math.max(...portfolio.holdings.map(h => h.weight));
  portfolio.holdings.forEach(h => {
    const wyCode    = toWyCode(h.stockCode);
    const rowEl     = el.querySelector(`.holding-pct[data-code="${wyCode}"]`);
    const barEl     = el.querySelector(`.holding-bar[data-code="${wyCode}"]`);
    if (!rowEl) return;

    const cached = priceCache[wyCode];
    if (cached && typeof cached.percent === 'number') {
      const p   = cached.percent;
      const cls = p > 0.001 ? 'up' : p < -0.001 ? 'down' : 'flat';
      rowEl.textContent = (p > 0 ? '+' : '') + p.toFixed(2) + '%';
      rowEl.className   = 'holding-pct ' + cls;
    }
    if (barEl) {
      barEl.style.width = (h.weight / maxW * 100).toFixed(1) + '%';
    }
  });

  // Timestamp
  const timeEl = el.querySelector('.card-update-time');
  if (timeEl) timeEl.textContent = '更新 ' + now;
}

// ─── 构建卡片 DOM ──────────────────────────────
function buildCard(portfolio) {
  const div = document.createElement('div');
  div.className = 'card';
  div.id = 'card-' + portfolio.id;

  const holdingsHTML = portfolio.holdings.map(h => {
    const wyCode = toWyCode(h.stockCode);
    return `
      <div class="holding-row">
        <div class="holding-name">${h.stockName}</div>
        <div class="holding-bar-wrap">
          <div class="holding-bar" data-code="${wyCode}" style="width:0%"></div>
        </div>
        <div class="holding-pct flat" data-code="${wyCode}">--.--%</div>
      </div>`;
  }).join('');

  div.innerHTML = `
    <div class="card-header">
      <div>
        <div class="card-name">${portfolio.name}</div>
        <div class="card-desc">${portfolio.holdings.map(h=>h.stockName).join(' · ')}</div>
      </div>
      <button class="card-delete" onclick="deletePortfolio('${portfolio.id}')" title="删除">×</button>
    </div>
    <div class="card-body">
      <div class="card-rate-row">
        <div class="card-rate flat" data-prev="0">--.--%</div>
        <div class="card-rate-badge flat">-- / -- 支</div>
      </div>
      <div class="card-holdings">${holdingsHTML}</div>
    </div>
    <div class="card-footer">
      <div class="card-update-time">等待数据…</div>
      <div class="card-status-dot loading"></div>
    </div>
  `;
  return div;
}

// ─── 渲染列表 ──────────────────────────────────
function renderList() {
  const list = document.getElementById('portfolioList');
  list.innerHTML = '';
  if (!portfolios.length) {
    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📊</div>
        <div class="empty-text">还没有组合<br>点击右上角「＋ 添加」创建</div>
      </div>`;
    return;
  }
  portfolios.forEach(p => list.appendChild(buildCard(p)));
}

// ─── 后端接口地址 ───────────────────────────────
const API_BASE      = 'http://localhost:8080/api/v1/portfolio';       // 公开接口（无需登录）
const API_BASE_USER = 'http://localhost:8080/api/v1/user';            // 用户态接口（需 Bearer Token）

// ─── 从后端拉取组合配方并添加（双模态） ──────────────
//
//  【未登录】→ GET  /api/v1/portfolio/recipe?code=xxx
//              holdings 存入 localStorage（本地模式）
//
//  【已登录】→ POST /api/v1/user/portfolio/add  + Bearer Token
//              body: { "code": "xxx" }
//              后端自行关联账号，前端再刷新云端列表
//
async function fetchAndAdd() {
  const input = document.getElementById('searchInput');
  const code  = input.value.trim();
  if (!code) { showToast('请输入组合代码'); return; }

  // 去重判断
  if (portfolios.some(p => p.code === code)) {
    showToast('该组合已添加');
    return;
  }

  const panel   = document.getElementById('addPanel');
  const msgEl   = document.getElementById('addPanelMsg');

  // ── 已登录：走云端添加路径 ─────────────────────────
  if (AUTH.isLoggedIn()) {
    msgEl.textContent = `正在添加「${code}」到云端…`;
    panel.classList.add('visible');

    try {
      // Step 1：通知后端绑定该组合到当前账号
      const addRes = await fetch(`${API_BASE_USER}/portfolio/add`, {
        method:  'POST',
        headers: AUTH.authHeaders(),
        body:    JSON.stringify({ code }),
      });

      if (addRes.status === 401) { handleTokenExpired(); return; }
      if (!addRes.ok) {
        const errText = await addRes.text().catch(() => addRes.statusText);
        throw new Error(`HTTP ${addRes.status}：${errText}`);
      }

      const addBody = await addRes.json();
      // 兼容后端直接返回单个组合对象，或 { data: {...} } 包装
      const newItem = addBody.data || addBody;

      if (newItem && newItem.holdings) {
        // 后端直接返回了完整组合，追加到本地渲染列表
        const p = {
          id:       newItem.id || ('srv_' + Date.now()),
          code:     code,
          name:     newItem.portfolioName || newItem.name || code,
          holdings: newItem.holdings,
        };
        portfolios.push(p);
        renderList();
        pollAll();
        showToast(`「${p.name}」已添加到云端 ✓`);
      } else {
        // 后端未返回详情，刷新全量列表兜底
        await fetchServerPortfolios();
        showToast(`「${code}」已添加 ✓`);
      }

      input.value = '';

    } catch (err) {
      console.error('[StockMix] 云端添加失败:', err);
      showToast(`添加失败：${err.message}`);
    } finally {
      panel.classList.remove('visible');
    }

    return; // 已登录路径到此结束
  }

  // ── 未登录：走本地路径（拉取 recipe → 存 localStorage）──
  msgEl.textContent = `正在加载「${code}」的配方…`;
  panel.classList.add('visible');

  try {
    const res = await fetch(`${API_BASE}/recipe?code=${encodeURIComponent(code)}`, {
      method:  'GET',
      headers: { 'Content-Type': 'application/json' },
    });

    if (!res.ok) {
      const errText = await res.text().catch(() => res.statusText);
      throw new Error(`HTTP ${res.status}：${errText}`);
    }

    const responseBody = await res.json();

    // 兼容 { data: { portfolioName, holdings } } 或直接 { portfolioName, holdings }
    const realData = responseBody.data || responseBody;
    if (!realData) throw new Error('后端返回的响应体 data 为空');

    const holdings = realData.holdings;
    const name     = realData.portfolioName || code;

    if (!Array.isArray(holdings) || !holdings.length) {
      throw new Error('后端返回的 holdings 为空');
    }

    const p = {
      id:       'p_' + Date.now(),
      code:     code,
      name:     name,
      holdings: holdings,
    };

    portfolios.push(p);
    savePortfolios();          // 本地模式才写 localStorage
    input.value = '';
    renderList();
    pollAll();
    showToast(`「${name}」已添加（本地）✓`);

  } catch (err) {
    console.error('[StockMix] 拉取组合配方失败:', err);
    showToast(`加载失败：${err.message}`);
  } finally {
    panel.classList.remove('visible');
  }
}

// 保留 closeAddPanel 供外部可能调用
function closeAddPanel() {
  document.getElementById('addPanel').classList.remove('visible');
}

// ─── 删除组合（双模态） ────────────────────────────
// 【已登录】→ DELETE /api/v1/user/portfolio/{id}  同步到云端
// 【未登录】→ 仅操作本地 localStorage
async function deletePortfolio(id) {
  // 先乐观更新 UI
  portfolios = portfolios.filter(p => p.id !== id);
  savePortfolios();
  renderList();
  showToast('已删除');

  // 已登录则同步通知后端
  if (AUTH.isLoggedIn()) {
    try {
      const res = await fetch(`${API_BASE_USER}/portfolio/${encodeURIComponent(id)}`, {
        method:  'DELETE',
        headers: AUTH.authHeaders(),
      });
      if (res.status === 401) { handleTokenExpired(); return; }
      if (!res.ok) console.warn(`[StockMix] 云端删除失败 HTTP ${res.status}`);
    } catch (err) {
      console.error('[StockMix] 云端删除请求异常:', err);
    }
  }
}

function savePortfolios() {
  localStorage.setItem('sm_portfolios', JSON.stringify(portfolios));
}

// ─── 搜索过滤（实时） ──────────────────────────
document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  document.querySelectorAll('.card').forEach(el => {
    const name = el.querySelector('.card-name')?.textContent.toLowerCase() || '';
    const desc = el.querySelector('.card-desc')?.textContent.toLowerCase() || '';
    el.style.display = (!q || name.includes(q) || desc.includes(q)) ? '' : 'none';
  });
});

// ─── 状态指示 ──────────────────────────────────
function setStatus(state) {
  const dot  = document.querySelector('.logo-dot');
  const text = document.getElementById('statusText');
  if (state === 'live')    { dot.style.background = 'var(--up)';   dot.style.boxShadow = '0 0 10px var(--up-glow)'; text.textContent = '实时'; }
  if (state === 'error')   { dot.style.background = 'var(--down)'; dot.style.boxShadow = '0 0 10px var(--down-glow)'; text.textContent = '重试中'; }
  if (state === 'loading') { dot.style.background = 'var(--flat)'; dot.style.boxShadow = 'none'; text.textContent = '更新中'; }
}

// ─── Toast ─────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ─── 启动 ──────────────────────────────────────
async function start() {
  // 1. 先刷新登录状态徽章
  refreshAuthBadge();

  if (AUTH.isLoggedIn()) {
    // 2a. 已登录：先合并本地缓存到云端，再从云端拉取全量列表
    //     mergeLocalToServer 内部会调用 fetchServerPortfolios → renderList → pollAll
    await mergeLocalToServer();
  } else {
    // 2b. 未登录：直接渲染本地数据并开始轮询
    renderList();
    pollAll();
  }

  // 3. 启动行情定时轮询（无论登录与否，行情刷新逻辑不变）
  pollTimer = setInterval(pollAll, 10000);
}

start();
</script>
